[project]
name = "kufar-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vasili Sikora", email = "vasili.sikora@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.basedpyright]
typeCheckingMode = "standard"
extraPaths = ["src"]


[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
